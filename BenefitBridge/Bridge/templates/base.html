{% load static i18n %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BenefitBridge</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- AOS Animation CSS -->
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <style>
        /* Page load animation */
        .page-animate {
            animation: fadeSlide 0.6s ease forwards;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Navbar animation */
        .nav-anim {
            position: relative;
            transition: color 0.2s ease;
            font-weight: 500;
        }

        .nav-anim::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -4px;
            width: 0%;
            height: 2px;
            background-color: #0d6efd;
            transition: width 0.25s ease;
        }

        .nav-anim:hover::after {
            width: 100%;
        }

        .nav-anim:hover {
            color: #0d6efd;
        }

        /* Card hover animation */
        .scheme-card {
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .scheme-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 18px 35px rgba(0,0,0,0.1);
        }

        /* Button animation */
        .btn {
            transition: transform 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
        }
    </style>
</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm px-4 sticky-top">
    <div class="container-fluid">

        <!-- LOGO -->
        <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'home' %}">
            <img src="{% static 'images/logo.png' %}" alt="Logo" height="45">
            <span class="fw-bold fs-5">BenefitBridge</span>
        </a>

        <!-- TOGGLER -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- NAV LINKS -->
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <ul class="navbar-nav align-items-center gap-3">

                <li class="nav-item">
                    <a class="nav-link nav-anim" href="{% url 'home' %}">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link nav-anim" href="{% url 'schemes' %}">Schemes</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link nav-anim" href="{% url 'saved' %}">Saved Schemes</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link nav-anim" href="{% url 'about' %}">About</a>
                </li>

                <!-- LANGUAGE -->
                <li class="nav-item dropdown">
    <a class="nav-link dropdown-toggle nav-anim" href="#" role="button"
       data-bs-toggle="dropdown">
        Language
    </a>
    <ul class="dropdown-menu dropdown-menu-end p-2">
        <li>
            <form action="{% url 'set_language' %}" method="post">
                {% csrf_token %}
                <button name="language" value="en" class="dropdown-item">English</button>
                <button name="language" value="te" class="dropdown-item">తెలుగు</button>
                <button name="language" value="hi" class="dropdown-item">हिंदी</button>
            </form>
        </li>
    </ul>
</li>


                <li class="nav-item">
                    <a href="{% url 'eligibility' %}" class="btn btn-primary px-4">
                        Check Eligibility
                    </a>
                </li>

            </ul>
        </div>
    </div>
</nav>

<!-- PAGE CONTENT -->
<div class="container mt-5 page-animate">
    {% block content %}
    {% endblock %}
</div>



<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Lottie -->
<script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

<!-- AOS -->
<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script>
    AOS.init({
        duration: 900,
        once: true
    });
</script>

</body>
</html>
