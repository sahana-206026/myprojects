{% extends "base.html" %}
{% block content %}

<h2 class="mb-4">Saved Schemes</h2>

{% if schemes %}
<div class="row g-4">
    {% for s in schemes %}
    <div class="col-md-6">
        <div class="card shadow-sm h-100 scheme-card">
            <div class="card-body">
                <h5 class="card-title">{{ s.name }}</h5>
                <p class="text-muted">{{ s.desc }}</p>

                <a href="{{ s.url }}" target="_blank"
                   class="btn btn-primary btn-sm">
                    Apply Now
                </a>

                <!-- ✅ REMOVE BUTTON -->
                <a href="?remove={{ s.id }}"
                   class="btn btn-outline-danger btn-sm ms-2">
                    ❌ Remove
                </a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% else %}
<p class="text-muted">You have not saved any schemes yet.</p>
{% endif %}

{% endblock %}
